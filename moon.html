<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Moon Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        
        .row {
            display: flex;
            gap: 15px;
        }
        
        .row .form-group {
            flex: 1;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #0f3460;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }
        
        .results h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .year-tag {
            display: inline-block;
            background: #1a1a2e;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .year-tag:hover {
            transform: scale(1.05);
        }
        
        .no-results {
            color: #666;
            text-align: center;
            padding: 20px;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .status-bar {
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        
        .status-bar.loaded {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-bar.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .data-info {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }
        
        .debug-box {
            background: #1a1a2e;
            color: #0f0;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 11px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        
        .debug-box.show {
            display: block;
        }
        
        #debugBtn {
            margin-top: 10px;
            padding: 8px;
            font-size: 12px;
            background: #666;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 Full Moon Calculator</h1>
        <p class="subtitle">Find years when a full moon falls on a specific date</p>
        
        <div id="statusBar" class="status-bar">Loading data...</div>
        
        <form id="calcForm">
            <div class="row">
                <div class="form-group">
                    <label>Month</label>
                    <select id="month">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Day</label>
                    <select id="day">
                        <!-- Will be populated by JavaScript -->
                    </select>
                </div>
            </div>
            
            <button type="submit" id="calcBtn" disabled>Find Full Moons</button>
        </form>
        
        <div id="error" class="error"></div>
        
        <div id="results" class="results" style="display:none;">
            <h2>Full Moons on <span id="displayDate"></span></h2>
            <div id="yearList"></div>
        </div>
        
        <div class="data-info">
            Data covers years 1900-2200
        </div>
        
        <button id="debugBtn">Show Debug Info</button>
        <div id="debugBox" class="debug-box"></div>
    </div>

    <script>
        let moonData = {};
        let dataLoaded = false;
        let debugMessages = [];
        
        function debug(msg) {
            console.log(msg);
            debugMessages.push(msg);
            const debugBox = document.getElementById('debugBox');
            debugBox.textContent = debugMessages.join('\n');
        }
        
        document.getElementById('debugBtn').addEventListener('click', function() {
            const box = document.getElementById('debugBox');
            box.classList.toggle('show');
            this.textContent = box.classList.contains('show') ? 'Hide Debug Info' : 'Show Debug Info';
        });
        
        // Populate days dropdown
        function populateDays(month) {
            const daySelect = document.getElementById('day');
            daySelect.innerHTML = '';
            
            let daysInMonth;
            if (month === 2) {
                daysInMonth = 29;
            } else if ([4, 6, 9, 11].includes(month)) {
                daysInMonth = 30;
            } else {
                daysInMonth = 31;
            }
            
            for (let i = 1; i <= daysInMonth; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                daySelect.appendChild(option);
            }
        }
        
        // Initialize with current month
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        document.getElementById('month').value = currentMonth;
        populateDays(currentMonth);
        
        // Update days when month changes
        document.getElementById('month').addEventListener('change', function() {
            populateDays(parseInt(this.value));
        });
        
        // Load the CSV data
        async function loadData() {
            const statusBar = document.getElementById('statusBar');
            const calcBtn = document.getElementById('calcBtn');
            
            try {
                statusBar.textContent = 'Loading moon data...';
                statusBar.className = 'status-bar';
                
                debug('=== STARTING LOAD ===');
                debug('Fetching full_moon_years.csv...');
                
                const response = await fetch('full_moon_years.csv');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                debug(`CSV loaded: ${csvText.length} characters`);
                debug(`First 500 characters:\n${csvText.substring(0, 500)}`);
                
                // Parse CSV line by line
                const lines = csvText.split('\n');
                debug(`Found ${lines.length} lines`);
                
                let loadedCount = 0;
                let errorCount = 0;
                let isHeader = true;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line === '') continue;
                    
                    // Skip header
                    if (isHeader) {
                        if (line.includes('month') || line.includes('Month')) {
                            debug(`Skipping header line ${i}: ${line}`);
                            isHeader = false;
                            continue;
                        }
                        isHeader = false;
                    }
                    
                    // Try to parse the line
                    let parts = [];
                    
                    // Try tab first
                    if (line.includes('\t')) {
                        parts = line.split('\t');
                    } 
                    // Try comma
                    else if (line.includes(',')) {
                        parts = line.split(',');
                    } 
                    // Try multiple spaces
                    else {
                        parts = line.split(/\s+/);
                    }
                    
                    // Remove empty parts
                    parts = parts.filter(p => p !== '');
                    
                    if (parts.length < 3) {
                        debug(`Line ${i}: Not enough parts (${parts.length}) - skipping`);
                        errorCount++;
                        continue;
                    }
                    
                    const month = parseInt(parts[0]);
                    const day = parseInt(parts[1]);
                    
                    if (isNaN(month) || isNaN(day)) {
                        debug(`Line ${i}: Invalid month/day - ${parts[0]}, ${parts[1]}`);
                        errorCount++;
                        continue;
                    }
                    
                    // Get years (everything after month and day)
                    let yearsStr = parts.slice(2).join(' ');
                    
                    // Remove any quotes
                    yearsStr = yearsStr.replace(/["']/g, '');
                    
                    try {
                        const years = JSON.parse(yearsStr);
                        
                        if (!Array.isArray(years)) {
                            debug(`Line ${i}: Not an array - skipping`);
                            errorCount++;
                            continue;
                        }
                        
                        const key = `${month}-${day}`;
                        moonData[key] = years;
                        loadedCount++;
                        
                        if (loadedCount <= 5) {
                            debug(`✅ Loaded: ${month}/${day} -> ${years.length} years`);
                        }
                    } catch (e) {
                        debug(`Line ${i}: Failed to parse JSON: ${yearsStr.substring(0, 50)}...`);
                        errorCount++;
                        continue;
                    }
                }
                
                debug(`\n=== SUMMARY ===`);
                debug(`✅ Successfully loaded: ${loadedCount} dates`);
                debug(`❌ Errors: ${errorCount}`);
                debug(`📊 Total keys: ${Object.keys(moonData).length}`);
                
                if (loadedCount > 0) {
                    const sampleKeys = Object.keys(moonData).slice(0, 10);
                    debug(`Sample keys: ${sampleKeys.join(', ')}`);
                    
                    // Check for September
                    const sepKeys = Object.keys(moonData).filter(k => k.startsWith('9-'));
                    debug(`September keys: ${sepKeys.join(', ')}`);
                    
                    // Check for 9/1 specifically
                    if (moonData['9-1']) {
                        debug(`✅ Found 9/1 with ${moonData['9-1'].length} years`);
                    } else {
                        debug(`❌ 9/1 not found`);
                    }
                }
                
                if (loadedCount > 0) {
                    dataLoaded = true;
                    statusBar.textContent = `✅ Loaded data for ${loadedCount} dates`;
                    statusBar.className = 'status-bar loaded';
                    calcBtn.disabled = false;
                } else {
                    throw new Error('No data was loaded from the CSV');
                }
                
            } catch (error) {
                console.error('Error loading data:', error);
                statusBar.textContent = `❌ Error: ${error.message}`;
                statusBar.className = 'status-bar error';
                calcBtn.disabled = true;
                debug(`ERROR: ${error.message}`);
                showError(`Failed to load data: ${error.message}`);
            }
        }
        
        // Load data when page loads
        loadData();
        
        document.getElementById('calcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!dataLoaded) {
                showError('Data is still loading. Please wait...');
                return;
            }
            
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            
            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('show');
            
            // Look up the data
            const key = `${month}-${day}`;
            debug(`\nLooking up: ${key}`);
            
            const years = moonData[key];
            
            if (!years) {
                debug(`❌ No data found for ${key}`);
                showError(`No data found for ${month}/${day}`);
                return;
            }
            
            debug(`✅ Found ${years.length} years for ${key}`);
            
            // Display results
            displayResults(month, day, years);
        });
        
        function displayResults(month, day, years) {
            const resultsDiv = document.getElementById('results');
            const yearList = document.getElementById('yearList');
            const displayDate = document.getElementById('displayDate');
            
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                               'July', 'August', 'September', 'October', 'November', 'December'];
            displayDate.textContent = `${monthNames[month-1]} ${day}`;
            
            resultsDiv.style.display = 'block';
            
            if (years.length === 0) {
                yearList.innerHTML = '<div class="no-results">No full moons found on this date</div>';
            } else {
                yearList.innerHTML = years.map(year => 
                    `<span class="year-tag">${year}</span>`
                ).join('');
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('results').style.display = 'none';
        }
    </script>
</body>
</html>
