<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Moon Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        
        .row {
            display: flex;
            gap: 15px;
        }
        
        .row .form-group {
            flex: 1;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #0f3460;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }
        
        .results h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .year-tag {
            display: inline-block;
            background: #1a1a2e;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .year-tag:hover {
            transform: scale(1.05);
        }
        
        .no-results {
            color: #666;
            text-align: center;
            padding: 20px;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .status-bar {
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        
        .status-bar.loaded {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-bar.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .data-info {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 Full Moon Calculator</h1>
        <p class="subtitle">Find years when a full moon falls on a specific date</p>
        
        <div id="statusBar" class="status-bar">Loading data...</div>
        
        <form id="calcForm">
            <div class="row">
                <div class="form-group">
                    <label>Month</label>
                    <select id="month">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Day</label>
                    <select id="day">
                        <!-- Will be populated by JavaScript -->
                    </select>
                </div>
            </div>
            
            <button type="submit" id="calcBtn" disabled>Find Full Moons</button>
        </form>
        
        <div id="error" class="error"></div>
        
        <div id="results" class="results" style="display:none;">
            <h2>Full Moons on <span id="displayDate"></span></h2>
            <div id="yearList"></div>
        </div>
        
        <div class="data-info">
            Data covers years 1900-2200
        </div>
    </div>

    <script>
        let moonData = {};
        let dataLoaded = false;
        
        // Populate days dropdown
        function populateDays(month) {
            const daySelect = document.getElementById('day');
            daySelect.innerHTML = '';
            
            // Get days in month
            let daysInMonth;
            if (month === 2) {
                daysInMonth = 29; // February (we'll handle invalid dates)
            } else if ([4, 6, 9, 11].includes(month)) {
                daysInMonth = 30;
            } else {
                daysInMonth = 31;
            }
            
            for (let i = 1; i <= daysInMonth; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                daySelect.appendChild(option);
            }
        }
        
        // Initialize with current month
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        document.getElementById('month').value = currentMonth;
        populateDays(currentMonth);
        
        // Update days when month changes
        document.getElementById('month').addEventListener('change', function() {
            populateDays(parseInt(this.value));
        });
        
        // Load the CSV data
        async function loadData() {
            const statusBar = document.getElementById('statusBar');
            const calcBtn = document.getElementById('calcBtn');
            
            try {
                statusBar.textContent = 'Loading moon data...';
                statusBar.className = 'status-bar';
                
                const response = await fetch('full_moon_years.csv');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                
                // Parse CSV
                const lines = csvText.split('\n');
                let loadedCount = 0;
                let isHeader = true;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line === '') continue;
                    
                    // Skip header
                    if (isHeader && (line.includes('month') || line.includes('Month'))) {
                        isHeader = false;
                        continue;
                    }
                    isHeader = false;
                    
                    // Split by tab or multiple spaces
                    let parts;
                    if (line.includes('\t')) {
                        parts = line.split('\t');
                    } else {
                        parts = line.split(/\s+/);
                    }
                    
                    // Remove empty parts
                    parts = parts.filter(p => p !== '');
                    
                    if (parts.length < 3) continue;
                    
                    const month = parseInt(parts[0]);
                    const day = parseInt(parts[1]);
                    
                    if (isNaN(month) || isNaN(day)) continue;
                    
                    // Get the years part (everything after month and day)
                    let yearsStr = parts.slice(2).join(' ');
                    
                    try {
                        // Parse the array
                        const years = JSON.parse(yearsStr);
                        const key = `${month}-${day}`;
                        moonData[key] = years;
                        loadedCount++;
                    } catch (e) {
                        // Skip invalid entries
                        continue;
                    }
                }
                
                dataLoaded = true;
                statusBar.textContent = `✅ Loaded data for ${loadedCount} dates`;
                statusBar.className = 'status-bar loaded';
                calcBtn.disabled = false;
                
            } catch (error) {
                console.error('Error loading data:', error);
                statusBar.textContent = '❌ Failed to load moon data. Please refresh the page.';
                statusBar.className = 'status-bar error';
                calcBtn.disabled = true;
                showError('Failed to load moon data. Make sure full_moon_years.csv is in the same folder.');
            }
        }
        
        // Load data when page loads
        loadData();
        
        document.getElementById('calcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!dataLoaded) {
                showError('Data is still loading. Please wait...');
                return;
            }
            
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            
            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('show');
            
            // Check if date is valid
            const testDate = new Date(2000, month - 1, day);
            if (testDate.getMonth() !== month - 1) {
                showError('Invalid date');
                return;
            }
            
            // Look up the data
            const key = `${month}-${day}`;
            const years = moonData[key];
            
            if (!years) {
                showError(`No data found for ${month}/${day}`);
                return;
            }
            
            // Display results
            displayResults(month, day, years);
        });
        
        function displayResults(month, day, years) {
            const resultsDiv = document.getElementById('results');
            const yearList = document.getElementById('yearList');
            const displayDate = document.getElementById('displayDate');
            
            // Format date
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                               'July', 'August', 'September', 'October', 'November', 'December'];
            displayDate.textContent = `${monthNames[month-1]} ${day}`;
            
            resultsDiv.style.display = 'block';
            
            if (years.length === 0) {
                yearList.innerHTML = '<div class="no-results">No full moons found on this date</div>';
            } else {
                yearList.innerHTML = years.map(year => 
                    `<span class="year-tag">${year}</span>`
                ).join('');
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('results').style.display = 'none';
        }
    </script>
</body>
</html>
