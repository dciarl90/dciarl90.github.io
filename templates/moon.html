<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Moon Date Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #0f3460;
        }
        
        .input-row {
            display: flex;
            gap: 15px;
        }
        
        .input-row .form-group {
            flex: 1;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(15, 52, 96, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .results {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .results-header h2 {
            font-size: 18px;
            color: #1a1a2e;
        }
        
        .badge {
            background: #0f3460;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .results-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .year-tag {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .year-tag:hover {
            transform: scale(1.05);
        }
        
        .no-results {
            color: #666;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .input-row {
                flex-direction: column;
                gap: 0;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 Full Moon Date Calculator</h1>
        <p class="subtitle">Find years when a full moon falls on a specific date</p>
        
        <form id="calculatorForm">
            <div class="input-row">
                <div class="form-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" min="1" max="12" placeholder="MM" required>
                </div>
                <div class="form-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" min="1" max="31" placeholder="DD" required>
                </div>
            </div>
            
            <div class="input-row">
                <div class="form-group">
                    <label for="startYear">Start Year</label>
                    <input type="number" id="startYear" min="1900" max="2100" placeholder="YYYY" required>
                </div>
                <div class="form-group">
                    <label for="endYear">End Year</label>
                    <input type="number" id="endYear" min="1900" max="2100" placeholder="YYYY" required>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary" id="calculateBtn">Calculate</button>
                <button type="reset" class="btn-secondary">Clear</button>
            </div>
        </form>
        
        <div id="errorMessage" class="error-message"></div>
        
        <div id="results" class="results" style="display: none;">
            <div class="results-header">
                <h2>Results</h2>
                <span class="badge" id="resultCount">0 years</span>
            </div>
            <div id="resultsList" class="results-list"></div>
        </div>
    </div>

    <script>
        document.getElementById('calculatorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            
            // Validation
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
            
            if (month < 1 || month > 12) {
                showError('Month must be between 1 and 12');
                return;
            }
            
            if (day < 1 || day > 31) {
                showError('Day must be between 1 and 31');
                return;
            }
            
            if (startYear > endYear) {
                showError('Start year must be less than or equal to end year');
                return;
            }
            
            if (startYear < 1900 || endYear > 2100) {
                showError('Years should be between 1900 and 2100');
                return;
            }
            
            // Show loading state
            const btn = document.getElementById('calculateBtn');
            btn.disabled = true;
            btn.textContent = 'Calculating...';
            
            const resultsDiv = document.getElementById('results');
            const resultsList = document.getElementById('resultsList');
            resultsDiv.style.display = 'block';
            resultsList.innerHTML = '<div class="loading">Calculating</div>';
            
            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        month: month,
                        day: day,
                        startYear: startYear,
                        endYear: endYear
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.results);
                } else {
                    showError('An error occurred while calculating');
                }
            } catch (error) {
                showError('Failed to connect to server. Please try again.');
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Calculate';
            }
        });
        
        function displayResults(results) {
            const resultsList = document.getElementById('resultsList');
            const resultCount = document.getElementById('resultCount');
            
            resultCount.textContent = `${results.length} year${results.length !== 1 ? 's' : ''}`;
            
            if (results.length === 0) {
                resultsList.innerHTML = '<div class="no-results">No full moons found on this date in the specified range</div>';
                return;
            }
            
            resultsList.innerHTML = results.map(year => 
                `<span class="year-tag">${year}</span>`
            ).join('');
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'none';
        }
        
        // Add real-time validation for date inputs
        document.getElementById('month').addEventListener('input', function() {
            if (this.value < 1) this.value = 1;
            if (this.value > 12) this.value = 12;
        });
        
        document.getElementById('day').addEventListener('input', function() {
            if (this.value < 1) this.value = 1;
            if (this.value > 31) this.value = 31;
        });
        
        // Set default values
        document.getElementById('month').value = new Date().getMonth() + 1;
        document.getElementById('day').value = new Date().getDate();
        document.getElementById('startYear').value = 2000;
        document.getElementById('endYear').value = 2050;
    </script>
</body>
</html>
